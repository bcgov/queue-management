[flake8]
ignore = I001, I003, I004, E126, W504
exclude = .git,*migrations*
max-line-length = 120
docstring-min-length=10
per-file-ignores =
    */__init__.py:F401

[pycodestyle]
max_line_length = 120
ignore = E501
docstring-min-length=10
notes=FIXME,XXX # TODO is ignored
match_dir = api
ignored-modules=flask_sqlalchemy
    sqlalchemy
per-file-ignores =
    */__init__.py:F401
good-names=
    b,
    d,
    i,
    e,
    f,
    u,
    rv,
    logger,
    id,
    p,

[pylint]
ignore=migrations,test
max_line_length=120
notes=FIXME,XXX,TODO
ignored-modules=flask_sqlalchemy,sqlalchemy,SQLAlchemy,alembic,scoped_session
ignored-classes=scoped_session
min-similarity-lines=8

[isort]
line_length = 120
indent = 4
multi_line_output = 4
lines_after_imports = 2


[tool:pytest]
addopts = --strict-markers --cov=app --cov-branch --cov-report html:htmlcov --cov-report xml:coverage.xml
testpaths = app/tests
python_files = test*.py
markers =
    integration: Disposable-Postgres integration coverage that requires the seeded API harness.
    contracts: Stable API contract and smoke assertions for seeded local test data.
    flows: Stateful end-to-end API regression workflows translated from the legacy Postman collections.
    auth: Authorization boundary tests for seeded synthetic identities.
    validation: Input validation and error handling assertions.
    smoke: Infrastructure and compatibility smoke assertions.
filterwarnings =
    ignore::UserWarning
