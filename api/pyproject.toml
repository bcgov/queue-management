[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "queue_api"
version = "0.0.0"
description = "Queue management API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.18,<1.19",
    "amqp>=5.3,<5.4",
    "click>=8.3,<8.4",
    "filelock>=3.25,<3.26",
    "Flask>=3.1,<3.2",
    "Flask-Admin>=2.0,<2.1",
    "Flask-Caching>=2.3,<2.4",
    "Flask-Compress>=1.23,<1.24",
    "Flask-Cors>=6.0,<6.1",
    "flask-jwt-oidc>=0.9,<0.10",
    "Flask-Login>=0.6,<0.7",
    "flask-marshmallow>=1.4,<1.5",
    "Flask-Migrate>=4.1,<4.2",
    "flask-restx>=1.3,<1.4",
    "Flask-SocketIO>=5.6,<5.7",
    "Flask-SQLAlchemy>=3.1,<3.2",
    "gevent>=25.9,<25.10",
    "gunicorn>=25.2,<25.3",
    "Jinja2>=3.1,<3.2",
    "kombu>=5.6,<5.7",
    "MarkupSafe>=3.0,<3.1",
    "marshmallow>=4.2,<4.3",
    "marshmallow-sqlalchemy>=1.4,<1.5",
    "minio>=7.2,<7.3",
    "psycopg2-binary>=2.9,<2.10",
    "python-dateutil>=2.9,<2.10",
    "python-dotenv>=1.2,<1.3",
    "python-jose>=3.5,<3.6",
    "redis>=7.4,<7.5",
    "requests>=2.33,<2.34",
    "snowplow-tracker>=1.1,<1.2",
    "SQLAlchemy>=2.0,<2.1",
    "WTForms>=3.2,<3.3",
]

[dependency-groups]
dev = [
    "isort>=8.0,<8.1",
    "pylint>=4.0,<4.1",
    "pytest>=9.0,<9.1",
    "pytest-cov>=7.1,<7.2",
]

[tool.setuptools]
include-package-data = true
py-modules = ["config", "manage", "qsystem", "sqlalchemy_utc", "version", "wsgi"]

[tool.setuptools.packages.find]
include = ["app*"]
