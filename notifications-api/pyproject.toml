[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notifications_api"
version = "0.0.0"
description = "Service BC notifications API"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Flask>=3.1,<3.2",
    "Flask-Caching>=2.3,<2.4",
    "flask-jwt-oidc>=0.9,<0.10",
    "flask-restx>=1.3,<1.4",
    "gunicorn>=25.2,<25.3",
    "Jinja2>=3.1,<3.2",
    "notifications-python-client>=9.0,<10",
    "python-dotenv>=1.2,<1.3",
    "requests>=2.33,<2.34",
]

[dependency-groups]
dev = [
    "pylint>=4.0,<4.1",
    "pytest>=9.0,<9.1",
    "pytest-cov>=7.1,<7.2",
    "ruff>=0.15.8",
]

[tool.setuptools]
include-package-data = true
py-modules = ["config", "gunicorn_config", "manage", "wsgi"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["api*"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
